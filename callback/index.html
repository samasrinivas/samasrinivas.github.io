<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tesla callback</title>
<style>body{font-family:sans-serif;padding:24px}code{display:block;word-break:break-all;font-size:18px;background:#eee;padding:12px}button{font-size:18px;padding:10px 20px;margin-top:12px}</style></head>
<body><h2>Tesla authorization</h2><div id="o"></div>
<script>
const p=new URLSearchParams(location.search),c=p.get('code'),e=p.get('error'),o=document.getElementById('o');
if(c){o.innerHTML='<p>Copy this code and send it to your bot (valid ~10 min, single use):</p><code id="c"></code><button onclick="navigator.clipboard.writeText(c)">Copy</button>';document.getElementById('c').textContent=c;}
else if(e){o.textContent='Error: '+e+' '+(p.get('error_description')||'');}
else{o.textContent='No code in URL.';}
</script></body></html>
